name: Validate market experience
on:
  pull_request:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'package*.json', '.github/workflows/validate-market.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m unittest discover -s tests -v
      - run: python scripts/render_snapshot.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
