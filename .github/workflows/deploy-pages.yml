name: Build and publish food-cost-jp

on:
  workflow_dispatch:
  schedule:
    # 05:30 JST = 20:30 UTC (previous day)
    - cron: "30 20 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/**"
      - "tests/**"
      - "README.md"
      - "package*.json"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test unit conversion
        run: python -m unittest discover -s tests -v

      - name: Build live site (retain last publication if credentials fail)
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GA_MEASUREMENT_ID: G-GFVSZ8YDQ5
        run: |
          test -n "$RAKUTEN_APPLICATION_ID" && test -n "$RAKUTEN_ACCESS_KEY" && test -n "$RAKUTEN_AFFILIATE_ID"
          python scripts/build_site.py

      - name: Fail closed on generated site quality
        run: python scripts/validate_generated_site.py site

      - name: Verify live market navigation, storage and tracking
        run: npm test

      - name: Publish verified generated site to the configured Pages branch
        run: |
          rm -rf categories guides deals saved data
          rm -f index.html 404.html robots.txt sitemap.xml .nojekyll
          cp site/index.html ./index.html
          cp site/404.html ./404.html
          cp -R site/categories ./categories
          if [ -d site/guides ]; then cp -R site/guides ./guides; fi
          if [ -d site/deals ]; then cp -R site/deals ./deals; fi
          if [ -d site/saved ]; then cp -R site/saved ./saved; fi
          if [ -d site/data ]; then cp -R site/data ./data; fi
          cp site/robots.txt ./robots.txt
          cp site/sitemap.xml ./sitemap.xml
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html categories guides deals saved data robots.txt sitemap.xml .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated food comparison site"
            git push origin HEAD:main
          fi
